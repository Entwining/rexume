name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# A release in progress finishes; a second push of the same tag waits.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/check.yml

  release:
    needs: check
    runs-on: macos-26
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify tag and release notes
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          test -n "$VERSION" && test "$GITHUB_REF_NAME" = "v$VERSION"
          test -s "docs/releases/$VERSION.md"
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - uses: actions/attest@v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A published release is a completed write; continue only with its tap notification.
          # A draft is a create that stopped before publishing, so it gets the assets and is published.
          if draft=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" = true ]; then
              gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
              gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
            else
              printf 'Release %s already exists; skipping creation\n' "$GITHUB_REF_NAME"
            fi
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --notes-file "docs/releases/${GITHUB_REF_NAME#v}.md" \
              --verify-tag --repo "$GITHUB_REPOSITORY"
          fi
      - uses: actions/create-github-app-token@v3.3.0
        id: tap-token
        with:
          client-id: ${{ vars.TAP_CLIENT_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: Entwining
          repositories: homebrew-tap
          # A repository dispatch needs only this; the token gets nothing else the app may hold.
          permission-contents: write
      - name: Ask the tap to pick up this version
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
        run: gh api repos/Entwining/homebrew-tap/dispatches -f event_type=rexume-release
